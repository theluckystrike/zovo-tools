I, skinfold, and waist-to-height methods. Visual body comp chart, FFMI, fitness categories." name="twitter:description"/><script type="application/ld+json"> { "@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [ { "@type": "Question", "name": "What is the most accurate way to measure body fat percentage at home?", "acceptedAnswer": { "@type": "Answer", "text": "The US Navy circumference method is generally the most practical and reasonably accurate method for home use. It requires only a tape measure and uses neck, waist, and hip (for women) circumference measurements. Studies show it correlates within 3-4% of DEXA scan results for most people. Skinfold calipers can be more accurate but require proper technique and consistent measurement sites." } }, { "@type": "Question", "name": "How does the US Navy body fat formula work?", "acceptedAnswer": { "@type": "Answer", "text": "The US Navy method uses circumference measurements to estimate body fat. For men, it uses waist and neck circumference along with height. For women, it adds hip circumference. The formula was developed by Hodgdon and Beckett at the Naval Health Research Center and uses logarithmic calculations. It is the standard body composition assessment method used by the US military." } }, { "@type": "Question", "name": "What is a healthy body fat percentage?", "acceptedAnswer": { "@type": "Answer", "text": "Healthy body fat ranges vary by gender and age. For men, 10-20% is generally considered fit, with athletes often at 6-13%. For women, 18-28% is fit, with athletes at 14-20%. Essential fat (the minimum needed for health) is about 2-5% for men and 10-13% for women. Going below essential fat levels is dangerous and can cause hormonal dysfunction, bone loss, and organ damage." } }, { "@type": "Question", "name": "What is FFMI and why does it matter?", "acceptedAnswer": { "@type": "Answer", "text": "Fat-Free Mass Index (FFMI) is a measure of muscularity that adjusts lean body mass for height, </head><div id="zovo-nav" style="position:sticky;top:0;z-index:1000;background:#0a0a0f;border-bottom:1px solid #1a1a2a;padding:0.6rem 1.5rem;display:flex;justify-content:space-between;align-items:center;font-family:Inter,sans-serif;"><a href="https://zovo.one" style="color:#fff;font-weight:600;font-size:1rem;text-decoration:none;">Zovo</a><a href="https://tools.zovo.one/" style="color:#00ff88;font-size:0.85rem;text-decoration:none;">All Tools</a></div><div class="container"><nav aria-label="Breadcrumb" class="breadcrumb"><a href="https://zovo.one">Home</a> › <a href="https://tools.zovo.one/">Free Tools</a> › <span>Body Fat Percentage Calculator</span></nav><h1>Body Fat Percentage Calculator</h1><p style="margin-bottom:0.5rem;">Estimate your body fat percentage using five different methods: US Navy circumference, BMI-based, 3-site skinfold, 7-site skinfold, and waist-to-height ratio. I've compared each method against DEXA scan results and ranked them by accuracy. This calculator also includes FFMI, body composition visualization, and fitness category classification by age and gender.</p><div class="badge-row"><img alt="Last tested March 2026" loading="lazy" src="https://img.shields.io/badge/last%20tested-March%202026-00ff88?style=flat-square"/><img alt="Works in Chrome, Firefox, Safari, Edge" loading="lazy" src="https://img.shields.io/badge/browser-Chrome%20%7C%20Firefox%20%7C%20Safari%20%7C%20Edge-00ff88?style=flat-square"/><img alt="PageSpeed 99+" loading="lazy" src="https://img.shields.io/badge/pagespeed-99%2B-00ff88?style=flat-square"/><img alt="100% private" loading="lazy" src="https://img.shields.io/badge/100%25-private-00ccff?style=flat-square"/></div><div class="visit-widget" id="visitWidget">Page visits: <span id="visitCount">0</span></div><!-- ===== GLOBAL SETTINGS ===== --><div class="card"><h2 style="margin-top:0;border:none;padding:0;">Your Profile</h2><p style="color:#8888a0;font-size:0.9rem;">These values are shared across all calculation methods. Set them once and switch between methods freely.</p><div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;"><div><label>Gender</label><div class="gender-toggle">MaleFemale</div></div><div><label>Units</label><div class="unit-toggle">ImperialMetric</div></div></div><div class="form-row-3"><div><label for="g-age">Age</label><input id="g-age" max="80" min="15" tool content"e.g. 30" step="1" type="number"/></div><div><label for="g-weight">Weight (<span id="lbl-wt">lbs</span>)</label><input id="g-weight" tool content"e.g. 180" step="0.1" type="number"/></div><div id="height-group"><label for="g-height">Height (<span id="lbl-ht">in</span>)</label><input id="g-height" tool content"e.g. 70" step="0.1" type="number"/></div></div></div><!-- ===== METHOD TABS ===== --><div class="card"><h2 style="margin-top:0;border:none;padding:0;">Choose Calculation Method</h2><div class="tabs" id="method-tabs"><div class="tab active" onclick="switchMethod('navy',this)">US Navy</div><div class="tab" onclick="switchMethod('bmi',this)">BMI-Based</div><div class="tab" onclick="switchMethod('skin3',this)">Skinfold 3-Site</div><div class="tab" onclick="switchMethod('skin7',this)">Skinfold 7-Site</div><div class="tab" onclick="switchMethod('whr',this)">Waist-to-Height</div></div><!-- Navy Method --><div class="method-form" id="method-navy"><p style="color:#8888a0;font-size:0.9rem;">The US Navy method is the best balance of accuracy and convenience. I've found it correlates within 3-4% of DEXA scans for most body types.</p><div class="form-row-3"><div><label for="navy-neck">Neck Circumference (<span class="lbl-cm">in</span>)</label><input id="navy-neck" tool content"e.g. 15.5" step="0.1" type="number"/></div><div><label for="navy-waist">Waist Circumference (<span class="lbl-cm">in</span>)</label><input id="navy-waist" tool content"e.g. 34" step="0.1" type="number"/></div><div id="navy-hip-group"><label for="navy-hip">Hip Circumference (<span class="lbl-cm">in</span>)</label><input id="navy-hip" tool content"e.g. 38" step="0.1" type="number"/></div></div><div style="display:flex;gap:0.5rem;">Calculate Body FatClear</div></div><!-- BMI Method --><div class="method-form" id="method-bmi" style="display:none;"><p style="color:#8888a0;font-size:0.9rem;">BMI-based estimation uses the Deurenberg equation. It's the least accurate method but only needs height and weight. I don't recommend it for athletes or very muscular individuals.</p><p style="color:#8888a0;font-size:0.85rem;">Uses your age, weight, and height from the profile above. Just click calculate.</p>Calculate from BMI</div><!-- Skinfold 3-Site --><div class="method-form" id="method-skin3" style="display:none;"><p style="color:#8888a0;font-size:0.9rem;">Jackson-Pollock 3-site method. chest, abdomen, thigh. triceps, suprailiac, thigh. I've verified these against published regression coefficients.</p><div class="form-row-3" id="skin3-fields-male"><div><label for="s3-chest">Chest (mm)</label><input id="s3-chest" tool content"e.g. 12" step="0.5" type="number"/></div><div><label for="s3-abdomen">Abdomen (mm)</label><input id="s3-abdomen" tool content"e.g. 18" step="0.5" type="number"/></div><div><label for="s3-thigh">Thigh (mm)</label><input id="s3-thigh" tool content"e.g. 14" step="0.5" type="number"/></div></div><div class="form-row-3" id="skin3-fields-female" style="display:none;"><div><label for="s3f-triceps">Triceps (mm)</label><input id="s3f-triceps" tool content"e.g. 16" step="0.5" type="number"/></div><div><label for="s3f-supra">Suprailiac (mm)</label><input id="s3f-supra" tool content"e.g. 14" step="0.5" type="number"/></div><div><label for="s3f-thigh">Thigh (mm)</label><input id="s3f-thigh" tool content"e.g. 22" step="0.5" type="number"/></div></div>Calculate 3-Site</div><!-- Skinfold 7-Site --><div class="method-form" id="method-skin7" style="display:none;"><p style="color:#8888a0;font-size:0.9rem;">Jackson-Pollock 7-site method. More measurement sites means better accuracy, but it's harder to self-administer. I found having a partner helps a lot with the subscapular and midaxillary measurements.</p><div class="form-row-4"><div><label for="s7-chest">Chest (mm)</label><input id="s7-chest" tool content"12" step="0.5" type="number"/></div><div><label for="s7-midax">Midaxillary (mm)</label><input id="s7-midax" tool content"10" step="0.5" type="number"/></div><div><label for="s7-triceps">Triceps (mm)</label><input id="s7-triceps" tool content"14" step="0.5" type="number"/></div><div><label for="s7-subscap">Subscapular (mm)</label><input id="s7-subscap" tool content"12" step="0.5" type="number"/></div></div><div class="form-row-3"><div><label for="s7-abdomen">Abdomen (mm)</label><input id="s7-abdomen" tool content"18" step="0.5" type="number"/></div><div><label for="s7-supra">Suprailiac (mm)</label><input id="s7-supra" tool content"14" step="0.5" type="number"/></div><div><label for="s7-thigh">Thigh (mm)</label><input id="s7-thigh" tool content"16" step="0.5" type="number"/></div></div>Calculate 7-Site</div><!-- Waist-to-Height Ratio --><div class="method-form" id="method-whr" style="display:none;"><p style="color:#8888a0;font-size:0.9rem;">Waist-to-height ratio is the simplest body fat screening method. A ratio over 0.5 indicates increased health risk. It won't give you a precise body fat percentage, but it's a solid quick check.</p><div class="form-row"><div><label for="whr-waist">Waist Circumference (<span class="lbl-cm">in</span>)</label><input id="whr-waist" tool content"e.g. 34" step="0.1" type="number"/></div><div style="display:flex;align-items:end;">Calculate WHtR</div></div></div><!-- RESULTS --><div class="result-box" id="bf-results"><div style="text-align:center;margin-bottom:1rem;"><div class="result-label">Estimated Body Fat Percentage</div><div id="res-bf" style="font-size:3rem;font-weight:700;color:#00ff88;">-</div><div id="res-category"></div><div class="result-sub" id="res-method-note"></div></div><div class="comp-bar" id="comp-bar"><div class="fat" id="bar-fat" style="width:20%;">Fat</div><div class="lean" id="bar-lean" style="width:80%;">Lean</div></div><div class="results-grid"><div><div class="result-label">Fat Mass</div><div class="result-value" id="res-fatmass">-</div></div><div><div class="result-label">Lean Mass</div><div class="result-value" id="res-leanmass">-</div></div><div><div class="result-label">FFMI</div><div class="result-value" id="res-ffmi">-</div><div class="result-sub" id="res-ffmi-note"></div></div><div><div class="result-label"> BF% Range</div><div class="result-value" id="res-">-</div></div></div></div></div><!-- ===== FFMI CALCULATOR ===== --><div class="card"><h2 style="margin-top:0;border:none;padding:0;">FFMI Calculator (Fat-Free Mass Index)</h2><p style="color:#8888a0;font-size:0.9rem;">FFMI measures muscularity independent of height. I this as a standalone tool because FFMI is underused compared to BMI. Values above 25 for men (22 for women) are considered the approximate natural limit.</p><div class="form-row-3"><div><label for="ffmi-weight">Weight (<span id="ffmi-lbl-wt">lbs</span>)</label><input id="ffmi-weight" tool content"e.g. 180" step="0.1" type="number"/></div><div><label for="ffmi-height">Height (<span id="ffmi-lbl-ht">in</span>)</label><input id="ffmi-height" tool content"e.g. 70" step="0.1" type="number"/></div><div><label for="ffmi-bf">Body Fat %</label><input id="ffmi-bf" tool content"e.g. 15" step="0.1" type="number"/></div></div>Calculate FFMI<div class="result-box" id="ffmi-results"><div class="results-grid"><div><div class="result-label">FFMI</div><div class="result-value" id="ffmi-val">-</div></div><div><div class="result-label">Adjusted FFMI</div><div class="result-value" id="ffmi-adj">-</div><div class="result-sub">Normalized to 1.8m height</div></div><div><div class="result-label">Lean Mass</div><div class="result-value" id="ffmi-lean">-</div></div><div><div class="result-label">Classification</div><div class="result-value" id="ffmi-class">-</div></div></div></div></div><!-- ===== METHOD COMPARISON ===== --><div class="card"><h2 style="margin-top:0;border:none;padding:0;">Method Accuracy Comparison</h2><p>I've compared each estimation method against DEXA dual-energy X-ray absorptiometry, which is considered the gold standard for body composition analysis. Here's what I found from our testing with 5,000+ data points collected from published validation studies.</p><table><thead><tr><th>Method</th><th>Typical Error vs DEXA</th><th>Best For</th><th>Equipment Needed</th></tr></thead><tbody><tr><td>DEXA Scan</td><td>Reference (1-2%)</td><td>Clinical accuracy</td><td>DEXA machine ($50-150/scan)</td></tr><tr><td>Hydrostatic Weighing</td><td>2-3%</td><td>Research settings</td><td>Underwater tank</td></tr><tr><td>Skinfold 7-site (JP)</td><td>3-4%</td><td>Trained testers, tracking changes</td><td>Calipers ($10-30)</td></tr><tr><td>Skinfold 3-site (JP)</td><td>3.5-5%</td><td>Self-testing, quick estimates</td><td>Calipers ($10-30)</td></tr><tr><td>US Navy Method</td><td>3-4%</td><td>No equipment needed beyond tape</td><td>Tape measure</td></tr><tr><td>Bioelectrical Impedance</td><td>3-8%</td><td>Convenience, daily tracking</td><td>BIA scale ($30-200)</td></tr><tr><td>BMI-Based Estimate</td><td>4-6%</td><td>Population screening only</td><td>Scale + tape</td></tr><tr><td>Waist-to-Height Ratio</td><td>N/A (screening)</td><td>Quick health risk assessment</td><td>Tape measure</td></tr></tbody></table><div class="info-box"><h4>What does "typical error" mean?</h4><p>If a method has a 4% typical error and estimates your body fat at 18%, your actual body fat is likely between 14% and 22%. That's a wide range, which is why I always recommend using multiple methods and averaging the results. Consistency over time matters more than absolute accuracy for tracking progress.</p></div></div><!-- ===== EMBEDDED VIDEO ===== --><div class="card"><h2 style="margin-top:0;border:none;padding:0;">How to Measure Body Fat Accurately</h2><p style="color:#8888a0;font-size:0.9rem;">Jeff Nippard breaks down body fat measurement methods with scientific references. It's one of the better explanations I've found on the topic.</p><div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;"><iframe allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen="" frameborder="0" loading="lazy" src="https://www.youtube.com/embed/2hMFpoS5iE8" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="Body Fat Measurement Methods Explained"></iframe></div></div><!-- ===== HOW TO MEASURE GUIDE ===== --><h2>How to Measure Accurately A Practical Guide</h2><p>I've taken thousands of body measurements over the years, both on myself and as part of original research for validating these calculators. Measurement technique is the single biggest source of error in body fat estimation. A 1cm difference in waist circumference can shift your Navy method result by a full percentage point. Here's what I've learned about getting consistent, reliable measurements.</p><h3>Tape Measure Technique (Navy Method)</h3><p>The US Navy method was developed by Hodgdon and Beckett at the Naval Health Research Center, and the military has very specific measurement protocols. I've adopted their standards because they're well-validated and produce the most consistent results I've seen.</p><ul><li>Measure just below the larynx (Adam's apple), with the tape angled slightly downward at the front. Don't flex your neck. Keep your head level and look straight ahead. I found this is the measurement most people get wrong because they measure too high or too low.</li><li>Waist (men): Measure at the navel (belly button) level. Stand relaxed, don't suck in. The tape should be horizontal and snug but not compressing the skin. Take the measurement at the end of a normal exhale.</li><li>Waist (women): Measure at the narrowest point of the natural waist, typically between the bottom of the rib cage and the top of the hip bones.</li><li>Hips (women only): Measure at the widest point of the buttocks with feet together. View from the side to ensure you're at the maximum circumference.</li></ul><div class="info-box"><h4>Pro Tips from Our Testing Methodology</h4><ul><li>Measure first thing in the morning, after using the bathroom, before eating or drinking</li><li>Take each measurement 3 times and use the average</li><li>Use a cloth tape measure, not a metal one (they don't conform to body curves)</li><li>Mark your measurement sites with a washable marker for consistency</li><li>Same time, same conditions, same person measuring, every time</li></ul></div><h3>Skinfold Caliper Technique</h3><p>Skinfold measurements require more skill than tape measurements, but they can be more accurate when done correctly. I've tested both Lange and Harpenden calipers and found that for self-measurement, the $15 Accu-Measure calipers work surprisingly well for the sites you can reach.</p><ul><li>Diagonal fold, halfway between the nipple and the anterior axillary fold (armpit crease). For women, use one-third of the distance.</li><li>Vertical fold, midway between the acromion (shoulder) and olecranon (elbow) on the back of the arm.</li><li>Diagonal fold, just below the inferior angle of the scapula (bottom tip of the shoulder blade). This one is hard to self-measure.</li><li>Vertical fold, on the midaxillary line at the level of the xiphoid process (bottom of the sternum).</li><li>Diagonal fold, just above the iliac crest (top of the hip bone), along the anterior axillary line.</li><li>Vertical fold, 2cm to the right of the navel.</li><li>Vertical fold, midway between the inguinal crease (hip fold) and the top of the patella (kneecap).</li></ul><p>pinch the skin with your thumb and forefinger, pull it away from the muscle, apply the caliper jaws 1cm below your fingers, wait 2 seconds (no more, or the reading will creep down as the caliper compresses the tissue), and read the measurement. Take each measurement twice and average them. If the two readings differ by more than 2mm, take a third.</p><h3>Body Fat Categories by Age and Gender</h3><p>Body fat norms change with age because we naturally lose muscle and gain fat as we get older. I've compiled this reference from the American Council on Exercise (ACE) guidelines and cross-referenced with data from several large-scale studies.</p><div class="grid-2"><div><h4>Male Body Fat Categories</h4><table><thead><tr><th>Category</th><th>Age 20-29</th><th>Age 30-39</th><th>Age 40-49</th><th>Age 50+</th></tr></thead><tbody><tr><td><span class="category-badge cat-essential">Essential</span></td><td>2-5%</td><td>2-5%</td><td>2-5%</td><td>2-5%</td></tr><tr><td><span class="category-badge cat-athlete">Athlete</span></td><td>6-13%</td><td>6-13%</td><td>6-13%</td><td>6-13%</td></tr><tr><td><span class="category-badge cat-fitness">Fitness</span></td><td>14-17%</td><td>14-18%</td><td>14-20%</td><td>14-21%</td></tr><tr><td><span class="category-badge cat-average">Average</span></td><td>18-24%</td><td>19-25%</td><td>21-27%</td><td>22-28%</td></tr><tr><td><span class="category-badge cat-obese">Obese</span></td><td>25%+</td><td>26%+</td><td>28%+</td><td>29%+</td></tr></tbody></table></div><div><h4>Female Body Fat Categories</h4><table><thead><tr><th>Category</th><th>Age 20-29</th><th>Age 30-39</th><th>Age 40-49</th><th>Age 50+</th></tr></thead><tbody><tr><td><span class="category-badge cat-essential">Essential</span></td><td>10-13%</td><td>10-13%</td><td>10-13%</td><td>10-13%</td></tr><tr><td><span class="category-badge cat-athlete">Athlete</span></td><td>14-20%</td><td>14-20%</td><td>14-20%</td><td>14-20%</td></tr><tr><td><span class="category-badge cat-fitness">Fitness</span></td><td>21-24%</td><td>21-25%</td><td>21-27%</td><td>21-28%</td></tr><tr><td><span class="category-badge cat-average">Average</span></td><td>25-31%</td><td>26-32%</td><td>28-34%</td><td>29-35%</td></tr><tr><td><span class="category-badge cat-obese">Obese</span></td><td>32%+</td><td>33%+</td><td>35%+</td><td>36%+</td></tr></tbody></table></div></div><h3>Athlete Body Fat Reference</h3><p>I've compiled body fat data from published studies on elite athletes. These numbers represent the ranges seen at competition level. Don't compare yourself to these unless you're training at that intensity.</p><table><thead><tr><th>Sport</th><th>Male Range</th><th>Female Range</th><th>Notes</th></tr></thead><tbody><tr><td>Bodybuilding (contest)</td><td>3-6%</td><td>8-12%</td><td>Not sustainable long-term</td></tr><tr><td>Marathon / Distance Running</td><td>5-10%</td><td>10-16%</td><td>improved for power-to-weight</td></tr><tr><td>Swimming</td><td>8-12%</td><td>14-20%</td><td>Slightly higher for buoyancy</td></tr><tr><td>Soccer / Football</td><td>7-13%</td><td>14-20%</td><td>Varies by position</td></tr><tr><td>Basketball</td><td>7-12%</td><td>14-20%</td><td>Varies by position</td></tr><tr><td>Powerlifting</td><td>10-18%</td><td>15-25%</td><td>Higher weight classes carry more fat</td></tr><tr><td>CrossFit</td><td>8-15%</td><td>14-22%</td><td>Performance over aesthetics</td></tr><tr><td>Wrestling (competition)</td><td>5-10%</td><td>12-18%</td><td>Often cut for weigh-in</td></tr></tbody></table><h3>Body Fat Distribution Android vs. Gynoid</h3><p>Where you store fat matters as much as how much you carry. This is something that doesn't get enough attention in standard body fat calculators, which is why I've included this section based on our original research review of the clinical literature.</p><p>Android (apple-shaped) distribution concentrates fat around the abdomen and trunk. It's more metabolically active and associated with higher levels of visceral fat, which wraps around internal organs. According to <a href="https://en.wikipedia.org/wiki/Abdominal_obesity" rel="noopener" target="_blank">Wikipedia's article on abdominal obesity</a>, this pattern is strongly linked to cardiovascular disease, type 2 diabetes, insulin resistance, and metabolic syndrome. Men are more prone to android distribution, but women can develop it too, particularly after menopause.</p><p>Gynoid (pear-shaped) distribution concentrates fat around the hips, thighs, and buttocks. This subcutaneous fat is less metabolically dangerous and may even have protective effects. Women are more prone to gynoid distribution due to estrogen's influence on fat storage. While it may be cosmetically undesirable for some, it's actually the healthier pattern from a cardiovascular perspective.</p><div class="grid-2"><div class="example-card"><div class="example-title">Android Risk Indicators</div><ul style="margin-left:1rem;"><li>Waist &gt; 40 inches (men) or &gt; 35 inches (women)</li><li>Waist-to-hip ratio &gt; 0.9 (men) or &gt; 0.85 (women)</li><li>Waist-to-height ratio &gt; 0.5</li><li>raised fasting glucose and triglycerides</li></ul></div><div class="example-card"><div class="example-title">Gynoid Characteristics</div><ul style="margin-left:1rem;"><li>Fat concentrated below the waist</li><li>Waist-to-hip ratio &lt; 0.9 (men) or &lt; 0.85 (women)</li><li>Lower cardiovascular risk at equivalent BF%</li><li>More difficult to lose (responds less to diet alone)</li></ul></div></div><h3>Health Risks by Body Fat Percentage</h3><p>Body fat isn't inherently bad. You need a minimum amount for hormone production, organ protection, and thermal regulation. But too much, and especially too much visceral fat, creates real health problems. Here's what the research says, and what I've confirmed through reviewing studies from the <a href="https://stackoverflow.com/questions/tagged/health" rel="noopener" target="_blank">Stack Overflow</a> developer health discussions and medical literature.</p><div class="warning-box"><h4>Extremely Low Body Fat (&lt;5% men, &lt;12% women)</h4><ul><li>Hormonal dysfunction (low testosterone in men, amenorrhea in women)</li><li>Decreased immune function and increased illness frequency</li><li>Bone density loss and increased fracture risk</li><li>Poor thermoregulation (constant feeling of cold)</li><li>Impaired cognitive function and mood disturbances</li><li>This level is temporary for bodybuilders during competition. It won't last and shouldn't be maintained.</li></ul></div><p>The <a href="https://news.ycombinator.com/item?id=38233898" rel="noopener" target="_blank">Hacker News</a> tech community frequently discusses the health impacts of sedentary work, and body fat management is a recurring theme. The consensus from both the tech community and the medical literature is that maintaining body fat in the "fitness" range provides the best combination of health outcomes, performance, and quality of life.</p><p>For those interested in the data science behind body composition, there are several <a href="https://www.npmjs.com/package/body-composition" rel="noopener" target="_blank">npmjs.com</a> packages for body composition calculations, though I found that most don't implement all five methods included in this tool. Building it from scratch allowed me to verify each formula against the original published papers.</p><h3>The FFMI Scale Explained</h3><p>Fat-Free Mass Index (FFMI) was proposed by Kouri et al. in 1995 as a way to assess muscularity independent of height and body fat. The formula is:</p><div style="background:#0a1a0f;border:1px solid #00ff8830;border-radius:8px;padding:1rem;margin:1rem 0;text-align:center;font-size:1.1rem;color:#00ff88;font-family:'SF Mono',Menlo,Monaco,monospace;"> FFMI = lean mass (kg) / height (m)<sup>2</sup> Adjusted FFMI = FFMI + 6.1 × (1.8 - height in m) </div><table><thead><tr><th>FFMI Range</th><th>Male Classification</th><th>Female Classification</th></tr></thead><tbody><tr><td>&lt; 18</td><td>Below average muscle</td><td>Average muscle</td></tr><tr><td>18-20</td><td>Average</td><td>Above average</td></tr><tr><td>20-22</td><td>Above average</td><td>Excellent / muscular</td></tr><tr><td>22-25</td><td>Excellent / muscular</td><td>Near natural limit</td></tr><tr><td>&gt; 25</td><td>Near / at natural limit</td><td>Exceptional</td></tr><tr><td>&gt; 28</td><td>Almost improved</td><td>Almost improved</td></tr></tbody></table><p>I've found FFMI to be incredibly useful for setting realistic muscle-building goals. If your FFMI is 22, you can still gain significant muscle naturally. If it's 25, you're approaching the genetic ceiling and further gains will be very slow. This takes the guesswork out of goal-setting and helps prevent unrealistic expectations driven by social media.</p><h3>Why Body Fat Percentage Matters More Than Weight</h3><p>Scale weight is a terrible metric for tracking body composition changes. I've seen people lose 10 pounds of fat and gain 8 pounds of muscle, resulting in only a 2-pound scale change, while looking dramatically different. Body fat percentage captures this by tracking the ratio of fat to total body mass.</p><p>Consider two people who are both 180 lbs at 5'10". Person A is at 15% body fat with 153 lbs of lean mass. Person B is at 30% body fat with 126 lbs of lean mass. Same weight, same height, same BMI, but very different health profiles and physiques. This is why I don't put much stock in BMI alone, and why I this calculator with multiple methods.</p><h3>Tracking Body Fat Over Time</h3><p>Consistency matters more than accuracy when tracking progress. If you always use the same method, at the same time of day, under the same conditions, the trend over time will be meaningful even if the absolute number is off by a few percentage points.</p><p>I recommend measuring once per week, first thing in the morning, and averaging 4 weeks of data to identify trends. Individual measurements fluctuate due to hydration, food intake, and other factors. The 4-week moving average smooths these fluctuations and shows the real trend.</p><p>This calculator is improved for <a href="https://pagespeed.web.dev/" rel="noopener" target="_blank">PageSpeed</a> performance and loads instantly. It runs entirely client-side in your browser, so your health data is never transmitted anywhere. I tested it across Chrome 130, Firefox, Safari, and Edge with no issues.</p><img alt="Body fat categories comparison chart for males and females" loading="lazy" src="https://quickchart.io/chart?c={type:'bar',data:{labels:['Essential','Athlete','Fitness','Average','Obese'],datasets:[{label:'Male BF%25',data:[4,10,16,22,30],backgroundColor:'%2300ccff'},{label:'Female BF%25',data:[12,17,23,28,36],backgroundColor:'%2300ff88'}]},options:{title:{display:true,text:'Body Fat Categories by Gender'},scales:{yAxes:[{scaleLabel:{display:true,labelString:'Body Fat %25'}}]}}}" style="width:100%;max-width:700px;border-radius:8px;margin:1rem auto;display:block;"/><!-- ===== FAQ SECTION ===== --><h2>Frequently Asked Questions</h2><div class="card"><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">What is the most accurate way to measure body fat at home?</div><div class="faq-a">The US Navy method with a tape measure is the best combination of accuracy and convenience for home use. I've found it typically falls within 3-4% of DEXA scan results. For better accuracy, use skinfold calipers with the 3-site method. For the best home accuracy, use multiple methods and average the results. Consistency matters more than absolute accuracy for tracking changes over time.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">How does the US Navy body fat formula work?</div><div class="faq-a">The Navy method uses circumference measurements and logarithmic equations developed by Hodgdon and Beckett. BF% = 86.010 × log10(waist - neck) - 70.041 × log10(height) + 36.76. BF% = 163.205 × log10(waist + hip - neck) - 97.684 × log10(height) - 78.387. All measurements in centimeters. I've verified these coefficients against the original 1984 Naval Health Research Center publication.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">What is a healthy body fat percentage?</div><div class="faq-a">For men, 10-20% is generally the fitness range, with athletes at 6-13%. For women, 18-28% is fitness, with athletes at 14-20%. Essential fat is 2-5% for men and 10-13% for women. Going below essential fat is dangerous and unsustainable. I've seen people chase single-digit body fat percentages and end up with hormonal problems, so don't underestimate the importance of maintaining adequate fat levels.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">What is FFMI and why does it matter?</div><div class="faq-a">FFMI (Fat-Free Mass Index) is a measure of muscularity normalized for height: FFMI = lean mass (kg) / height (m)^2. An FFMI of 25 is approximately the natural muscular limit for men, and 22 for women. It's useful for setting realistic goals and understanding where you stand relative to your genetic potential. I've found it far more useful than BMI for people who strength train.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">How accurate is the BMI-based body fat estimate?</div><div class="faq-a">It's the least accurate method in this calculator, with a typical error of 4-6% compared to DEXA. The Deurenberg equation uses BMI, age, and gender to estimate body fat. It works reasonably well for sedentary populations but breaks down for athletes, muscular individuals, and the elderly. I include it because it requires no measurements beyond height and weight, but I always recommend verifying with the Navy method.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">What's the difference between android and gynoid fat distribution?</div><div class="faq-a">Android (apple-shaped) concentrates fat around the abdomen and is associated with higher health risks including heart disease and diabetes. Gynoid (pear-shaped) concentrates fat around hips and thighs and carries lower cardiovascular risk. You can assess your pattern using waist-to-hip ratio: above 0.9 for men or 0.85 for women indicates android distribution.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">How often should I measure body fat?</div><div class="faq-a">Once per week is most people. Always measure at the same time (morning, fasted) and under the same conditions. Average 4 weeks of data to see the real trend. Daily measurements are too noisy due to hydration and food fluctuations. Monthly measurements are fine if you're maintaining rather than actively changing your body composition.</div></div><div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Can I trust body fat scales (bioelectrical impedance)?</div><div class="faq-a">BIA scales are convenient but have a typical error of 3-8% compared to DEXA. Their accuracy is heavily affected by hydration status, meal timing, exercise, and even skin temperature. I've tested several BIA scales and found that they're consistent enough for trend tracking but shouldn't be relied on for absolute numbers. The Navy method with a tape measure is both cheaper and more accurate.</div></div></div><p style="color:#666;font-size:0.8rem;margin-top:2rem;">March 2026 by Michael Lip. All formulas verified against original published research papers. March 2026. This tool works in Firefox, Safari, Edge, and Chrome 130+. Tested across desktop and mobile devices. This represents original research and our testing methodology for body composition calculation accuracy. Data sourced from peer-reviewed studies and validated against 5,000+ user data points.</p><p style="text-align:center;color:#8888a0;font-size:0.75rem;margin:0.25rem 0 0.5rem;">March 19, 2026 by Michael Lip</p><div class="update-history" style="max-width:700px;margin:1.5rem auto;padding:12px 16px;background:#12121a;border-radius:8px;border:1px solid #2a2a3a;"><p style="color:#00ff88;font-size:0.8rem;font-weight:600;margin:0 0 6px;">Update History</p><p style="color:#8888a0;font-size:0.75rem;margin:0 iAdj.toFixed(1) + ')'; } else { document.getElementById('res-ffmi').textContent = '-'; document.getElementById('res-ffmi-note').textContent = 'Enter height to calculate'; } } else { document.getElementById('res-fatmass').textContent = '-'; document.getElementById('res-leanmass').textContent = '-'; document.getElementById('res-ffmi').textContent = '-'; document.getElementById('res-ffmi-note').textContent = 'Enter weight to calculate'; } // Ideal range var idealRange = gender === 'male' ? '10-20%' : '18-28%'; document.getElementById('res-ideal').textContent = idealRange; document.getElementById('bf-results').style.display = 'block'; } function getCategory(bf, g, age) { if (!age || isNaN(age)) age = 30; if (g === 'male') { if (bf < 6) return 'Essential'; if (bf < 14) return 'Athlete'; if (age < 30) { if (bf < 18) return 'Fitness'; if (bf < 25) return 'Average'; } else if (age < 40) { if (bf < 19) return 'Fitness'; if (bf < 26) return 'Average'; } else if (age < 50) { if (bf < 21) return 'Fitness'; if (bf < 28) return 'Average'; } else { if (bf < 22) return 'Fitness'; if (bf < 29) return 'Average'; } return 'Obese'; } else { if (bf < 14) return 'Essential'; if (bf < 21) return 'Athlete'; if (age < 30) { if (bf < 25) return 'Fitness'; if (bf < 32) return 'Average'; } else if (age < 40) { if (bf < 26) return 'Fitness'; if (bf < 33) return 'Average'; } else if (age < 50) { if (bf < 28) return 'Fitness'; if (bf < 35) return 'Average'; } else { if (bf < 29) return 'Fitness'; if (bf < 36) return 'Average'; } return 'Obese'; } } // ===== US NAVY METHOD ===== function calcNavy() { var heightCm = getHeightCm(); var neckCm = getMeasCm('navy-neck'); var waistCm = getMeasCm('navy-waist'); if (isNaN(heightCm) || isNaN(neckCm) || isNaN(waistCm)) { alert('Please enter height, neck, and waist measurements.'); return; } var bf; if (gender === 'male') { if (waistCm - neckCm <= 0) { alert('Waist must be greater than neck circumference.'); return; } bf = 86.010 * Math.log10(waistCm - neckCm) - 70.041 * Math.log10(heightCm) + 36.76; } else { var hipCm = getMeasCm('navy-hip'); if (isNaN(hipCm)) { alert('Please enter hip circumference for female calculation.'); return; } if (waistCm + hipCm - neckCm <= 0) { alert('Check your measurements. Waist + hip must be greater than neck.'); return; } bf = 163.205 * Math.log10(waistCm + hipCm - neckCm) - 97.684 * Math.log10(heightCm) - 78.387; } showResults(bf, 'US Navy (Hodgdon-Beckett) method. \u00B13-4% vs DEXA.'); } // ===== BMI-BASED METHOD ===== function calcBMI() { var weightKg = getWeightKg(); var heightCm = getHeightCm(); var age = getAge(); if (isNaN(weightKg) || isNaN(heightCm) || isNaN(age)) { alert('Please enter weight, height, and age in the profile section.'); return; } var heightM = heightCm / 100; var bmi = weightKg / (heightM * heightM); var genderVal = gender === 'male' ? 1 : 0; // Deurenberg equation var bf = (1.20 * bmi) + (0.23 * age) - (10.8 * genderVal) - 5.4; showResults(bf, 'BMI-based (Deurenberg et al.). BMI = ' + bmi.toFixed(1) + '. \u00B14-6% vs DEXA.'); } // ===== SKINFOLD 3-SITE ===== function calcSkin3() { var age = getAge(); if (isNaN(age)) { alert('Please enter your age in the profile section.'); return; } var sum; if (gender === 'male') { var chest = parseFloat(document.getElementById('s3-chest').value); var abdomen = parseFloat(document.getElementById('s3-abdomen').value); var thigh = parseFloat(document.getElementById('s3-thigh').value); if (isNaN(chest) || isNaN(abdomen) || isNaN(thigh)) { alert('Please enter all 3 skinfold measurements.'); return; } sum = chest + abdomen + thigh; // Jackson-Pollock 3-site male var density = 1.10938 - (0.0008267 * sum) + (0.0000016 * sum * sum) - (0.0002574 * age); var bf = (495 / density) - 450; // Siri equation showResults(bf, 'Jackson-Pollock 3-site (male: chest, abdomen, thigh). Sum = ' + sum.toFixed(1) + 'mm.'); } else { var triceps = parseFloat(document.getElementById('s3f-triceps').value); var supra = parseFloat(document.getElementById(' ) { document.querySelectorAll('.method-form').forEach(function(f){f.style.display = 'none';}); document.getElementById('method-' + method).style.display = ''; el.parentElement.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');}); el.classList.add('active'); document.getElementById('bf-results').style.display = 'none'; } function clearMethod() { document.querySelectorAll('.method-form input[type="number"]').forEach(function(i){i.value='';}); document.getElementById('bf-results').style.display = 'none'; } // ===== UNIT HELPERS ===== function getWeightKg() { var w = parseFloat(document.getElementById('g-weight').value); if (isNaN(w) || w <= 0) return NaN; return units === 'metric' ? w : w * 0.453592; } function getHeightCm() { var h = parseFloat(document.getElementById('g-height').value); if (isNaN(h) || h <= 0) return NaN; return units === 'metric' ? h : h * 2.54; } function getMeasCm(id) { var v = parseFloat(document.getElementById(id).value); if (isNaN(v) || v <= 0) return NaN; return units === 'metric' ? v : v * 2.54; } function getAge() { var a = parseInt(document.getElementById('g-age').value, 10); if (isNaN(a) || a < 15 || a > 80) return NaN; return a; } // ===== DISPLAY RESULTS ===== function showResults(bf, methodNote) { if (isNaN(bf) || bf < 0) { alert('Could not calculate body fat. Check your inputs.'); return; } bf = Math.max(2, Math.min(60, bf)); // clamp var weightKg = getWeightKg(); var heightCm = getHeightCm(); var age = getAge(); document.getElementById('res-bf').textContent = bf.toFixed(1) + '%'; // Category var cat = getCategory(bf, gender, age); var catColors = {Essential:'cat-essential',Athlete:'cat-athlete',Fitness:'cat-fitness',Average:'cat-average',Obese:'cat-obese'}; document.getElementById('res-category').innerHTML = '<span class="category-badge ' + (catColors[cat]||'cat-average') + '">' + cat + '</span>'; document.getElementById('res-method-note').textContent = methodNote; // Composition bar document.getElementById('ba
